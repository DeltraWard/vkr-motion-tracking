<text x="777" y="529.62" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Удержать поправку</text>
<text x="777" y="555.66" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">и отметить потерю оптики</text>
<text x="500" y="672.96" text-anchor="middle" font-size="19" font-weight="400" fill="#191919">Выдать исправленную ориентацию и статус</text>
