<text x="500" y="85.48" text-anchor="middle" font-size="22" font-weight="400" fill="#191919">Получить отсчёт и доступную оптику</text>
<text x="500" y="159.12" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Есть новая</text>
