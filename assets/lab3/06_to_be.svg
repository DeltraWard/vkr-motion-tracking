<text x="192.0" y="49.48" text-anchor="middle" font-size="22" font-weight="700" fill="#191919">Оператор</text>
<text x="728.0" y="49.48" text-anchor="middle" font-size="22" font-weight="700" fill="#191919">Программа</text>
<text x="190" y="168.98" text-anchor="middle" font-size="22" font-weight="400" fill="#191919">Выбрать источник</text>
<text x="728" y="171.14" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Источник?</text>
<text x="536" y="273.48" text-anchor="middle" font-size="22" font-weight="400" fill="#191919">Загрузить запись</text>
<text x="932" y="260.40" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">Создать измерения</text>
<text x="932" y="285.20" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">и отдельный эталон</text>
<text x="728" y="395.98" text-anchor="middle" font-size="22" font-weight="400" fill="#191919">Проверить входы</text>
<text x="728" y="468.80" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">Входы корректны?</text>
<text x="980" y="547.40" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">Показать</text>
<text x="980" y="572.20" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">причину отказа</text>
<text x="728" y="547.12" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Выполнить три режима</text>
<text x="728" y="573.16" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">на тех же отсчётах</text>
<text x="728" y="645.14" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Есть эталон?</text>
<text x="536" y="731.12" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Рассчитать</text>
<text x="536" y="757.16" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">угловые ошибки</text>
<text x="932" y="731.40" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">Отметить, что точность</text>
<text x="932" y="756.20" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">не оценивалась</text>
<text x="728" y="867.30" text-anchor="middle" font-size="20" font-weight="400" fill="#191919">Сохранить выходы и журнал</text>
<text x="190" y="867.64" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Открыть сравнение</text>
<text x="520" y="208.12" text-anchor="end" font-size="18" font-weight="400" fill="#191919">[запись]</text>
<text x="947" y="208.12" text-anchor="start" font-size="18" font-weight="400" fill="#191919">[генератор]</text>
<text x="995" y="497.12" text-anchor="start" font-size="18" font-weight="400" fill="#191919">[нет]</text>
<text x="746" y="515.12" text-anchor="start" font-size="18" font-weight="400" fill="#191919">[да]</text>
<text x="520" y="677.12" text-anchor="end" font-size="18" font-weight="400" fill="#191919">[да]</text>
<text x="946" y="677.12" text-anchor="start" font-size="18" font-weight="400" fill="#191919">[нет]</text>
