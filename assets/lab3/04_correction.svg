<text x="777" y="268.34" text-anchor="middle" font-size="22" font-weight="400" fill="#191919">Сохранить</text>
<text x="777" y="295.62" text-anchor="middle" font-size="22" font-weight="400" fill="#191919">предыдущую цель</text>
<text x="500" y="419.12" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Оптика актуальна?</text>
<text x="500" y="445.16" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Возраст ≤ 200 мс</text>
<text x="223" y="529.62" text-anchor="middle" font-size="21" font-weight="400" fill="#191919">Приблизить поправку к цели</text>
